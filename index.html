    async function initSupabaseAndLoad(showFeedback = false) {
      const cfg = getSavedSbConfig();
      if (!cfg.url || !cfg.anonKey || !window.supabase) {
        dbConnected = false;
        return false;
      }
      try {
        sbClient = window.supabase.createClient(cfg.url, cfg.anonKey);
        const { data: caseRows, error } = await sbClient.from('cases').select('*').order('received_date', { ascending: false });
        if (error) throw error;
        if (Array.isArray(caseRows) && caseRows.length > 0) {
          state.cases = caseRows.map(mapDbCaseToApp);
        }
        const { data: rateRows } = await sbClient.from('insurer_rates').select('*').order('id', { ascending: true });
        if (Array.isArray(rateRows) && rateRows.length > 0) {
          state.insurerRates = rateRows.map(r => ({ id: 'ir' + r.id, name: r.name, overhead: r.overhead, fee: r.fee_rate, surveyFee: r.survey_fee }));
        }
        const { data: noticeRows } = await sbClient.from('notices').select('*').order('id', { ascending: false });
        if (Array.isArray(noticeRows) && noticeRows.length > 0) {
          state.notices = noticeRows.map(n => ({ id: n.id, title: n.title, summary: n.summary, content: n.content, date: n.published_date, read: false }));
        }
        dbConnected = true;
        if (showFeedback) showToast('Supabase 실시간 DB와 연결되었습니다!');
        render();
        return true;
      } catch (err) {
        dbConnected = false;
        if (showFeedback) showToast('Supabase 연결 실패: 주소와 키를 확인해 주세요.', 'error');
        return false;
      }
    }

    async function syncCaseToDb(c) {
      if (!dbConnected || !sbClient || !c) return;
      try {
        const { error } = await sbClient.from('cases').upsert(mapAppCaseToDb(c), { onConflict: 'case_no' });
        if (error) console.error('DB sync error:', error);
      } catch (e) {}
    }

    async function uploadImageToSupabaseStorage(dataUrl, fileName = 'photo.jpg') {
      if (!dbConnected || !sbClient || !dataUrl || !dataUrl.startsWith('data:')) return dataUrl;
      try {
        const res = await fetch(dataUrl);
        const blob = await res.blob();
        const ext = (blob.type && blob.type.split('/')[1]) || 'jpg';
        const safePath = `cases/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
        const { error } = await sbClient.storage.from('case-photos').upload(safePath, blob, {
          contentType: blob.type || 'image/jpeg',
          upsert: true
        });
        if (error) { console.error('Storage upload error:', error); return dataUrl; }
        const { data } = sbClient.storage.from('case-photos').getPublicUrl(safePath);
        return data?.publicUrl || dataUrl;
      } catch (e) {
        console.error('Storage upload exception:', e);
        return dataUrl;
      }
    }

    async function saveDbConfig() {
      const url = document.getElementById('sb-url').value.trim();
      const anonKey = document.getElementById('sb-key').value.trim();

      try { localStorage.setItem('daehung_supabase_cfg', JSON.stringify({ url, anonKey })); } catch (e) {}
      closeModal();
      await initSupabaseAndLoad(true);
    }

    function clearDbConfig() {

    function calcEstimateTotals(items, overheadRate = 0.05, profitRate = 0.10) {
      const mat = items.filter(i => i.cat === '재료비').reduce((s, i) => s + (Number(i.qty) * Number(i.price)), 0);
      const lab = items.filter(i => i.cat === '노무비').reduce((s, i) => s + (Number(i.qty) * Number(i.price)), 0);
      const exp = items.filter(i => i.cat === '경비').reduce((s, i) => s + (Number(i.qty) * Number(i.price)), 0);
      const direct = mat + lab + exp;
      const overhead = Math.round(direct * overheadRate);
      const profit = Math.round((direct + overhead) * profitRate);
      const rawSupply = direct + overhead + profit;
      const supply = Math.floor(rawSupply / 100) * 100;
      const rounding = supply - rawSupply;
      const vat = Math.round(supply * 0.1);
      const total = supply + vat;
      return { mat, lab, exp, direct, overhead, profit, rounding, supply, vat, total };
    }

      state.user = { ...acc };
      state.route = acc.role === 'daehung' ? 'home' : 'cases';
      state.mobileMenuOpen = false;
      state.notifOpen = false;
      saveSession();
      showToast(`${acc.name}님(${acc.roleLabel})으로 로그인되었습니다.`);
      render();
    }

          }));
        }

    }

    function restoreSession() {
      try {
        const raw = localStorage.getItem('daehung_session');
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed && parsed.user && parsed.user.role) {
          state.user = parsed.user;
          if (parsed.route) state.route = parsed.route;
          if (parsed.activeCaseId) state.activeCaseId = parsed.activeCaseId;
        }
      } catch (e) {}
    }

    // =========================================================================
    // 5. 공통 레이아웃 (사이드바 + 상단 헤더)
    // =========================================================================
    function renderShell(contentHtml) {
      const menus = getMenusForRole(state.user.role);
      const unreadNotifs = state.notifications.filter(n => !n.read).length;
      const unreadNotices = state.notices.filter(n => !n.read).length;

      const navHtml = menus.map(m => {
        if (m.children) {
          const anyChildActive = m.children.some(c => c.id === state.route);
          return `
            <div class="space-y-1">
              <div class="px-3 py-2 text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2 mt-2">
                <i data-lucide="${m.icon}" class="w-3.5 h-3.5"></i>
                <span>${m.label}</span>
              </div>
              <div class="space-y-0.5 pl-2">
                ${m.children.map(c => {
                  const active = state.route === c.id;
                  return `
                    <button type="button" onclick="navigate('${c.id}')"
                      class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition flex items-center justify-between cursor-pointer ${active ? 'bg-blue-50 text-blue-700 font-semibold' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'}">
                      <span>${c.label}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }
        const active = state.route === m.id;
        return `
          <button type="button" onclick="navigate('${m.id}')"
            class="w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition flex items-center justify-between cursor-pointer ${active ? 'bg-blue-50 text-blue-700 font-semibold' : 'text-slate-700 hover:bg-slate-100 hover:text-slate-900'}">
            <span class="flex items-center gap-2.5">
              <i data-lucide="${m.icon}" class="w-4 h-4"></i>
              <span>${m.label}</span>
            </span>
            ${m.id === 'notices' && unreadNotices > 0 ? `<span class="px-1.5 py-0.5 text-[11px] font-semibold rounded-full bg-rose-100 text-rose-700">${unreadNotices}</span>` : ''}
          </button>
        `;
      }).join('');

      return `
        <div class="min-h-screen flex bg-slate-50">
          <!-- 모바일 오버레이 -->
          ${state.mobileMenuOpen ? `<div onclick="toggleMobileMenu()" class="fixed inset-0 bg-slate-900/40 z-30 lg:hidden"></div>` : ''}

          <!-- 좌측 사이드바 -->
          <aside class="${state.mobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} lg:translate-x-0 fixed lg:static inset-y-0 left-0 z-40 w-64 bg-white border-r border-slate-200 flex flex-col transition-transform duration-200 shrink-0">

    function toggleMobileMenu() { state.mobileMenuOpen = !state.mobileMenuOpen; render(); }
    function toggleNotif() { state.notifOpen = !state.notifOpen; render(); }
    function markAllNotifsRead() { state.notifications.forEach(n => n.read = true); render(); }

    // =========================================================================
    // 6. 역할 1: 보험사·공제조합 화면들
    // =========================================================================
    function renderInsurerCases() {
      const f = state.casesFilter;
      let list = state.cases.filter(c => {
        if (f.tab === 'todo' && c.insurerTask !== 'todo') return false;
        if (f.tab === 'progress' && c.insurerTask !== 'progress') return false;
        if (f.tab === 'done' && c.insurerTask !== 'done') return false;
        if (f.over7 && c.elapsedDays <= 7) return false;
        if (f.q) {
          const q = f.q.toLowerCase();
          if (!`${c.id} ${c.title} ${c.address} ${c.facility}`.toLowerCase().includes(q)) return false;
        }
        return true;
      });
      list.sort((a, b) => f.sort === 'oldest' ? a.elapsedDays < b.elapsedDays ? 1 : -1 : a.elapsedDays > b.elapsedDays ? 1 : -1);

      const cntAll = state.cases.length;
      const cntTodo = state.cases.filter(c => c.insurerTask === 'todo').length;
      const cntProg = state.cases.filter(c => c.insurerTask === 'progress').length;
      const cntDone = state.cases.filter(c => c.insurerTask === 'done').length;
      const cntOver7 = state.cases.filter(c => c.elapsedDays > 7).length;

      return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <h2 class="text-xl font-bold text-slate-900">의뢰 진행확인</h2>
            <p class="text-sm text-slate-500 mt-0.5">접수된 피해복구 의뢰의 진행 상태와 할 일을 한눈에 확인합니다.</p>
          </div>
          <button type="button" onclick="openNewCasePage()" class="px-4 py-2.5 rounded-xl bg-blue-700 hover:bg-blue-800 text-white text-sm font-semibold flex items-center gap-1.5 self-start cursor-pointer shadow-xs">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>복구의뢰 접수</span>
          </button>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 p-4 space-y-3">
          <div class="flex flex-wrap items-center gap-2">
            ${[
              ['all', '전체', cntAll],
              ['todo', '내 할 일', cntTodo],
              ['progress', '처리 중', cntProg],
              ['done', '완료', cntDone]
            ].map(([k, lbl, cnt]) => `
              <button type="button" onclick="setCaseTab('${k}')"

    function renderDaehungClaims() {
      const f = state.claimsFilter;
      const list = state.cases.filter(c => {
        if (f.kind !== '전체' && c.kind !== f.kind) return false;
        if (f.tab === 'need_write' && c.claimStage !== 'need_write') return false;
        if (f.tab === 'wait_read' && c.claimStage !== 'wait_read') return false;
        if (f.tab === 'read_done' && c.claimStage !== 'read_done') return false;
        return c.partnerClaimAmt > 0;
      });
      const cWrite = state.cases.filter(c => c.claimStage === 'need_write').length;
      const cWait = state.cases.filter(c => c.claimStage === 'wait_read').length;
      const cDone = state.cases.filter(c => c.claimStage === 'read_done').length;
      const cAll = state.cases.filter(c => c.partnerClaimAmt > 0).length;

      return `
        <div>
          <h2 class="text-xl font-bold text-slate-900">보험사 청구</h2>
          <p class="text-sm text-slate-500 mt-0.5">복구업체 청구 내역을 검토하여 보험사 청구서를 작성·공개합니다.</p>
        </div>
        <div class="bg-white rounded-2xl border border-slate-200 p-4 flex flex-wrap gap-2">
          ${[
            ['need_write', `작성할 청구 ${cWrite}`],
            ['wait_read', `공개·열람 대기 ${cWait}`],
            ['read_done', `열람 완료 ${cDone}`],
            ['all', `전체 ${cAll}`]
          ].map(([k, lbl]) => `
            <button type="button" onclick="state.claimsFilter.tab='${k}'; render();"
              class="px-3 py-1.5 rounded-full text-xs font-semibold cursor-pointer ${f.tab === k ? 'bg-blue-700 text-white' : 'bg-slate-100 text-slate-700'}">${lbl}</button>
          `).join('')}
        </div>
        <div class="bg-white rounded-2xl border border-slate-200 overflow-x-auto">
          <table class="w-full text-left text-sm min-w-[740px]">
            <thead class="bg-slate-50 border-b border-slate-200 text-xs text-slate-500">
              <tr>
                <th class="px-4 py-3 font-semibold">피해현장</th>
                <th class="px-4 py-3 font-semibold">업체 청구액</th>
                <th class="px-4 py-3 font-semibold">보험사 청구액</th>
                <th class="px-4 py-3 font-semibold">진행 (업체 청구 → 작성·공개 → 기관 열람 → 수령)</th>
                <th class="px-4 py-3 font-semibold text-right">다음 행동</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              ${list.map(c => {
                const stp = c.receivedAmt > 0 ? 4 : c.claimStage === 'read_done' ? 3 : c.claimStage === 'wait_read' ? 2 : 1;
                return `
                  <tr class="hover:bg-slate-50/70">
                    <td class="px-4 py-3.5"><span class="font-mono text-xs text-blue-700 font-semibold">${escapeHtml(c.id)}</span><div class="font-semibold text-slate-900">${escapeHtml(c.title)}</div></td>
                    <td class="px-4 py-3.5 text-slate-700">${won(c.partnerClaimAmt)}</td>
                    <td class="px-4 py-3.5 font-bold text-slate-900">${won(c.insurerClaimAmt)}</td>
                    <td class="px-4 py-3.5 text-xs">
                      <div class="flex items-center gap-1">
                        ${['업체 청구','작성·공개','기관 열람','수령'].map((s,i)=>`<span class="px-2 py-0.5 rounded-full ${stp>=i+1?'bg-blue-50 text-blue-700 font-semibold':'bg-slate-100 text-slate-400'}">${s}</span>`).join('')}
                      </div>
                    </td>
                    <td class="px-4 py-3.5 text-right">
                      <button type="button" onclick="openClaimDetailPage('${c.id}')" class="px-3 py-1.5 rounded-lg bg-blue-700 text-white hover:bg-blue-800 text-xs font-semibold cursor-pointer">
                        ${c.claimStage === 'need_write' ? '청구서 작성' : '청구서 수정'}
                      </button>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderDaehungReceipts() {
      const f = state.receiptsFilter;
      const all = state.cases.filter(c => c.insurerClaimAmt > 0);
      const list = all.filter(c => {
        if (f.tab === 'need_confirm') return c.confirmedAmt === 0;
        if (f.tab === 'need_recv') return c.confirmedAmt > 0 && c.receivedAmt === 0;
        if (f.tab === 'done') return c.receivedAmt > 0;
        return true;
      });
      const selected = state.cases.find(c => c.id === f.selectedId) || list[0] || all[0];

      return `
        <div>
          <h2 class="text-xl font-bold text-slate-900">보험금 수령</h2>
          <p class="text-sm text-slate-500 mt-0.5">보험사 확정 금액과 실제 입금(수령) 내역을 기록합니다.</p>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <div class="text-sm font-bold text-slate-900">입금내역 엑셀 자동 반영</div>
            <div class="text-xs text-slate-500">은행 입금내역 엑셀을 업로드하면 해당 건의 수령액이 자동으로 매칭됩니다.</div>
          </div>
          <div class="flex gap-2">
            <button type="button" onclick="showToast('입금내역 표준 양식(receipt_template.xlsx) 내려받기를 시작했습니다.', 'info')" class="px-3 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-700 hover:bg-slate-50 cursor-pointer">입금내역 양식 내려받기</button>
            <button type="button" onclick="showToast('입금내역 엑셀 반영 시뮬레이션이 완료되었습니다.')" class="px-3 py-2 rounded-xl bg-slate-900 text-white text-xs font-semibold hover:bg-slate-800 cursor-pointer">입금내역 엑셀 올리기</button>
          </div>
        </div>

        <div class="flex flex-wrap gap-2">
          ${[
            ['need_confirm', `확정 기록 필요 ${all.filter(c=>c.confirmedAmt===0).length}`],
            ['need_recv', `입금 확인 필요 ${all.filter(c=>c.confirmedAmt>0 && c.receivedAmt===0).length}`],
            ['done', `기록 완료 ${all.filter(c=>c.receivedAmt>0).length}`],
            ['all', `전체 ${all.length}`]
          ].map(([k, lbl]) => `
            <button type="button" onclick="state.receiptsFilter.tab='${k}'; render();"
              class="px-3 py-1.5 rounded-full text-xs font-semibold cursor-pointer ${f.tab===k?'bg-blue-700 text-white':'bg-white border border-slate-200 text-slate-700'}">${lbl}</button>
          `).join('')}
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
          <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead class="bg-slate-50 border-b border-slate-200 text-xs text-slate-500">
                <tr>
                  <th class="px-4 py-3 font-semibold">피해현장</th>
                  <th class="px-4 py-3 font-semibold">보험사 확정</th>
                  <th class="px-4 py-3 font-semibold">보험금 수령</th>
                  <th class="px-4 py-3 font-semibold text-right">선택</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${list.map(c => `
                  <tr class="${selected?.id === c.id ? 'bg-blue-50/60' : 'hover:bg-slate-50'}">
                    <td class="px-4 py-3"><span class="font-mono text-xs text-blue-700 font-semibold">${escapeHtml(c.id)}</span><div class="font-semibold text-slate-900 text-xs mt-0.5">${escapeHtml(c.title)}</div></td>
                    <td class="px-4 py-3 text-xs font-semibold">${c.confirmedAmt ? won(c.confirmedAmt) : '<span class="text-slate-400">미확정</span>'}</td>
                    <td class="px-4 py-3 text-xs font-semibold">${c.receivedAmt ? won(c.receivedAmt) : '<span class="text-slate-400">미수령</span>'}</td>
                    <td class="px-4 py-3 text-right">
                      <button type="button" onclick="state.receiptsFilter.selectedId='${c.id}'; render();" class="px-2.5 py-1 rounded-lg bg-blue-100 text-blue-700 text-xs font-semibold cursor-pointer">기록</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 p-5 space-y-4">
            <h3 class="text-sm font-bold text-slate-900">확정·수령 등록</h3>
            ${selected ? `
              <div class="p-3 rounded-xl bg-slate-50 text-xs space-y-1">
                <div class="font-mono font-bold text-blue-700">${escapeHtml(selected.id)}</div>
                <div class="font-semibold text-slate-900">${escapeHtml(selected.title)}</div>
                <div class="text-slate-500">청구액: ${won(selected.insurerClaimAmt)}</div>
              </div>
              <div class="space-y-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">보험사 확정액 (원)</label>
                  <input id="rec-confirm" type="number" value="${selected.confirmedAmt || selected.insurerClaimAmt}" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">보험금 수령액 (원)</label>
                  <input id="rec-recv" type="number" value="${selected.receivedAmt || selected.insurerClaimAmt}" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm" />
                </div>
                <button type="button" onclick="saveReceiptRecord('${selected.id}')" class="w-full py-2.5 rounded-xl bg-blue-700 hover:bg-blue-800 text-white text-sm font-semibold cursor-pointer">
                  확정·수령 저장
                </button>
              </div>
            ` : '<div class="text-xs text-slate-400">좌측 목록에서 건을 선택하세요.</div>'}
          </div>
        </div>
      `;
    }

    function renderDaehungSettlements() {
      const f = state.settlementsFilter;
      const list = state.cases.filter(c => {
        if (c.insurerClaimAmt === 0) return false;
        if (f.company !== '전체' && c.partnerOrg !== f.company) return false;
        if (f.payStatus !== '전체' && c.paidStatus !== f.payStatus) return false;
        return true;
      });
      const sumClaim = list.reduce((a, c) => a + c.insurerClaimAmt, 0);
      const sumRecv = list.reduce((a, c) => a + c.receivedAmt, 0);
      const sumFee = list.reduce((a, c) => a + Math.round((c.receivedAmt || c.insurerClaimAmt) * c.feeRate), 0);
      const sumPay = list.reduce((a, c) => a + Math.round((c.receivedAmt || c.insurerClaimAmt) * (1 - c.feeRate)), 0);

      return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <h2 class="text-xl font-bold text-slate-900">업체 청구·정산</h2>
            <p class="text-sm text-slate-500 mt-0.5">대흥이엔씨 수수료를 반영한 시공파트너사 지급 정산 내역입니다.</p>
          </div>
          <button type="button" onclick="openFeeSettingModal()" class="px-4 py-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-xs font-semibold text-slate-700 self-start cursor-pointer">
            수수료 설정
          </button>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="bg-white rounded-2xl border border-slate-200 p-4"><div class="text-xs text-slate-500">보험사 청구 · ${list.length}건</div><div class="text-lg font-bold mt-1">${won(sumClaim)}</div></div>
          <div class="bg-white rounded-2xl border border-slate-200 p-4"><div class="text-xs text-slate-500">보험금 수령</div><div class="text-lg font-bold text-emerald-700 mt-1">${won(sumRecv)}</div></div>
          <div class="bg-white rounded-2xl border border-slate-200 p-4"><div class="text-xs text-slate-500">대흥이엔씨 수수료</div><div class="text-lg font-bold text-blue-700 mt-1">${won(sumFee)}</div></div>
          <div class="bg-white rounded-2xl border border-slate-200 p-4"><div class="text-xs text-slate-500">업체 지급액</div><div class="text-lg font-bold text-slate-900 mt-1">${won(sumPay)}</div></div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 p-4 flex flex-wrap gap-3 items-center">
          <select onchange="state.settlementsFilter.company=this.value; render();" class="px-3 py-2 rounded-xl border border-slate-200 text-xs bg-white">
            <option value="전체" ${f.company==='전체'?'selected':''}>전체 복구업체</option>
            <option value="한빛복구" ${f.company==='한빛복구'?'selected':''}>한빛복구</option>
            <option value="태성인프라" ${f.company==='태성인프라'?'selected':''}>태성인프라</option>
          </select>
          <select onchange="state.settlementsFilter.payStatus=this.value; render();" class="px-3 py-2 rounded-xl border border-slate-200 text-xs bg-white">
            <option value="전체" ${f.payStatus==='전체'?'selected':''}>전체 지급 상태</option>
            <option value="지급 대기" ${f.payStatus==='지급 대기'?'selected':''}>지급 대기</option>
            <option value="지급 완료" ${f.payStatus==='지급 완료'?'selected':''}>지급 완료</option>
          </select>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 overflow-x-auto">
          <table class="w-full text-left text-sm min-w-[780px]">
            <thead class="bg-slate-50 border-b border-slate-200 text-xs text-slate-500">
              <tr>
                <th class="px-4 py-3 font-semibold">피해현장</th>
                <th class="px-4 py-3 font-semibold">보험사 청구</th>
                <th class="px-4 py-3 font-semibold">보험금 수령</th>
                <th class="px-4 py-3 font-semibold">수수료</th>
                <th class="px-4 py-3 font-semibold">업체 지급액</th>
                <th class="px-4 py-3 font-semibold text-right">지급</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              ${list.map(c => {
                const base = c.receivedAmt || c.insurerClaimAmt;
                const fee = Math.round(base * c.feeRate);
                const pay = base - fee;
                return `
                  <tr class="hover:bg-slate-50/70">
                    <td class="px-4 py-3.5"><span class="font-mono text-xs text-blue-700 font-semibold">${escapeHtml(c.id)}</span> · <span class="text-xs text-slate-500">${escapeHtml(c.partnerOrg)}</span><div class="font-semibold text-slate-900">${escapeHtml(c.title)}</div></td>
                    <td class="px-4 py-3.5 text-xs">${won(c.insurerClaimAmt)}</td>
                    <td class="px-4 py-3.5 text-xs font-semibold text-emerald-700">${won(c.receivedAmt)}</td>
                    <td class="px-4 py-3.5 text-xs text-blue-700">${won(fee)} (${Math.round(c.feeRate*100)}%)</td>
                    <td class="px-4 py-3.5 text-xs font-bold">${won(pay)}</td>
                    <td class="px-4 py-3.5 text-right">

    function submitNewRequest() {
      const title = document.getElementById('nr-title').value.trim();

      const newId = 'DH-2026-' + Math.floor(1110 + Math.random() * 880);
      state.cases.unshift({
        id: newId, date: '2026-11-20', elapsedDays: 0, kind, facility, title, address: addr, plate,
        insurerOrg: state.user.org || '버스공제조합', partnerOrg: '한빛복구', partnerManager: '미지정',

    function submitIssueAccount(scope) {
      const name = document.getElementById('ia-name').value.trim();
      const loginId = document.getElementById('ia-id').value.trim();
      if (!name || !loginId) { showToast('이름과 아이디를 입력해 주세요.', 'error'); return; }
      if (scope === 'acc_org') {
        state.orgAccounts.push({ id: 'oa' + Date.now(), name, loginId, role: '손해사정사', org: document.getElementById('ia-org').value, noti: '이메일', status: '활성' });

    function handleNewCaseFiles(input) {
      if (!input.files || !input.files.length) return;
      const files = Array.from(input.files);
      files.forEach((file, idx) => {
        const reader = new FileReader();
        reader.onload = e => {
          const item = {
            name: file.name,
            size: Math.round(file.size / 1024) + 'KB',
            url: e.target.result,
            origUrl: e.target.result,
            annotations: [],
            caption: '',
            isImage: file.type.startsWith('image/')
          };
          state.newCaseForm.files.push(item);
          if (dbConnected && item.isImage) {
            uploadImageToSupabaseStorage(e.target.result, file.name).then(pubUrl => {
              item.url = pubUrl; item.origUrl = pubUrl; render();
            });
          }
          const newIdx = state.newCaseForm.files.length - 1;
          render();
          if (idx === 0 && file.type.startsWith('image/')) {
            openPhotoEditor('__NEW_CASE__', 'docs', newIdx);
          }
        };
        reader.readAsDataURL(file);
      });
      input.value = '';
    }

    const facModalState = {
      target: 'wizard',
      activeCat: 'road',
      search: '',
      selected: []
    };

    function openFacilityModal(target) {
      facModalState.target = target;
      facModalState.activeCat = 'road';
      facModalState.search = '';
      if (target === 'newCaseForm') {
        facModalState.selected = [...state.newCaseForm.selectedFacilities];
      } else {
        const c = ensureCaseDetails(state.cases.find(x => x.id === state.activeCaseId));
        facModalState.selected = c ? [...c.selectedFacilities] : [];
      }
      renderFacilityModal();
    }

    function toggleFacModalItem(item) {
      const idx = facModalState.selected.indexOf(item);
      if (idx >= 0) facModalState.selected.splice(idx, 1);
      else facModalState.selected.push(item);
      renderFacilityModal();
    }

    function applyFacilityModal() {
      if (facModalState.target === 'newCaseForm') {
        state.newCaseForm.selectedFacilities = [...facModalState.selected];
      } else {
        const c = state.cases.find(x => x.id === state.activeCaseId);
        if (c) {
          c.selectedFacilities = [...facModalState.selected];
          if (c.selectedFacilities.length > 0) c.facility = c.selectedFacilities[0];
          syncCaseToDb(c);
        }
      }
      closeModal();
      render();
    }

    function renderFacilityModal() {
      const q = facModalState.search.trim().toLowerCase();
      const currentCat = FACILITY_CATEGORIES.find(cat => cat.id === facModalState.activeCat) || FACILITY_CATEGORIES[0];
      const visibleItems = q
        ? FACILITY_CATEGORIES.flatMap(cat => cat.items.filter(it => it.toLowerCase().includes(q)).map(it => ({ it, icon: cat.icon, catName: cat.name })))
        : currentCat.items.map(it => ({ it, icon: currentCat.icon, catName: currentCat.name }));

      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-3 sm:p-4">

              </button>
            </div>

            <div class="p-4 border-b border-slate-100 space-y-3 bg-slate-50/70">
              <div class="relative">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input type="text" value="${escapeHtml(facModalState.search)}" oninput="facModalState.search=this.value; renderFacilityModal();" placeholder="시설물 이름으로 검색" class="w-full pl-9 pr-3 py-2 rounded-xl border border-slate-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
              </div>
              <div class="flex flex-wrap gap-1.5">
                ${FACILITY_CATEGORIES.map(cat => `
                  <button type="button" onclick="facModalState.activeCat='${cat.id}'; facModalState.search=''; renderFacilityModal();"
                    class="px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-1.5 cursor-pointer ${!q && facModalState.activeCat===cat.id ? 'bg-blue-700 text-white' : 'bg-white border border-slate-200 text-slate-700 hover:bg-slate-100'}">
                    <i data-lucide="${cat.icon}" class="w-3.5 h-3.5"></i>
                    <span>${cat.name} (${cat.items.length})</span>
                  </button>
                `).join('')}
              </div>
            </div>

            <div class="p-4 overflow-y-auto scrollbar-thin flex-1">
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                ${visibleItems.map(({ it, icon, catName }) => {
                  const sel = facModalState.selected.includes(it);
                  return `
                    <button type="button" onclick="toggleFacModalItem('${it}')"
                      class="p-3 rounded-xl border text-left transition flex items-center justify-between gap-2 cursor-pointer ${sel ? 'border-blue-600 bg-blue-50 ring-1 ring-blue-600' : 'border-slate-200 bg-white hover:border-blue-300'}">
                      <div class="flex items-center gap-2.5 min-w-0">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 ${sel ? 'bg-blue-700 text-white' : 'bg-slate-100 text-slate-600'}">

                        </div>
                        <div class="min-w-0">
                          <div class="text-xs font-bold text-slate-900 truncate">${escapeHtml(it)}</div>
                          ${q ? `<div class="text-[10px] text-slate-400 truncate">${escapeHtml(catName)}</div>` : ''}
                        </div>
                      </div>
                      <span class="text-[11px] font-semibold shrink-0 ${sel ? 'text-blue-700' : 'text-slate-400'}">${sel ? '선택됨' : '선택'}</span>

          </div>

    let wizardExtraOpen = false;

    function addWizardVictim(caseId) {
      const c = ensureCaseDetails(state.cases.find(x => x.id === caseId));
      if (c) { c.victims.push({ type: '개인', name: '', phone: '' }); render(); }
    }

    function updateWizardVictim(caseId, idx, field, val) {
      const c = ensureCaseDetails(state.cases.find(x => x.id === caseId));
      if (c && c.victims[idx]) c.victims[idx][field] = val;
    }

    function handleWizardMapClick(event, caseId) {
      const el = event.currentTarget;
      const rect = el.getBoundingClientRect();
      const x = Math.max(5, Math.min(95, Math.round(((event.clientX - rect.left) / rect.width) * 100)));
      const y = Math.max(8, Math.min(92, Math.round(((event.clientY - rect.top) / rect.height) * 100)));
      const c = ensureCaseDetails(state.cases.find(x => x.id === caseId));
      if (c) { c.mapPin = { x, y }; render(); }
    }

    function saveWizardStep(stp, action = 'next', targetStep = null) {
      const c = ensureCaseDetails(state.cases.find(x => x.id === state.activeCaseId));
      if (!c) return;
      if (stp === 1) {
        const t = document.getElementById('wz-title')?.value.trim();
        if (t) c.title = t;
      } else if (stp === 2) {
        const a = document.getElementById('wz-addr')?.value.trim();
        const d = document.getElementById('wz-detail-addr')?.value.trim();
        if (a) c.address = a;
        if (d !== undefined) c.detailAddress = d;
      } else if (stp === 3) {
        c.victimName = c.victims[0]?.name || '';
        c.victimPhone = c.victims[0]?.phone || '';
      } else if (stp === 4) {
        const desc = document.getElementById('wz-desc')?.value;
        const pl = document.getElementById('wz-plate')?.value;
        if (desc !== undefined) c.accidentDesc = desc;
        if (pl) c.plate = pl;
      }
      if (action === 'done') {
        c.insurerTask = 'progress';
        c.insurerAction = '상세 보기';
        c.insurerGuide = '상세 접수 정보 입력이 완료되어 복구업체 배정 대기 중입니다.';
      }
      syncCaseToDb(c);
      if (action === 'exit' || action === 'done') {
        showToast('저장되었습니다.');
        navigate('cases');
      } else if (action === 'prev') {
        state.wizardStep = Math.max(1, stp - 1);
        render();
      } else if (action === 'jump' && targetStep) {
        state.wizardStep = targetStep;
        render();
      } else {
        state.wizardStep = Math.min(4, stp + 1);
        render();
      }
    }

      c.claimMemo = document.getElementById('cl-memo').value;
      c.claimStage = 'wait_read';
      c.claimReadStep = 1;
      c.stage = '03';
      c.insurerTask = 'todo';
      c.insurerAction = '청구 서류 확인';
      syncCaseToDb(c);
      showToast('보험사 청구서가 공개되었습니다.');

    function handleReportPhotoUpload(caseId, slot, input) {
      const c = ensureCaseDetails(state.cases.find(x => x.id === caseId));
      if (!c || !input.files || !input.files.length) return;
      const files = Array.from(input.files);
      files.forEach((file, idx) => {
        const reader = new FileReader();
        reader.onload = e => {
          const item = { name: file.name, url: e.target.result, origUrl: e.target.result, annotations: [], caption: '' };
          c.photos[slot].push(item);
          if (dbConnected) {
            uploadImageToSupabaseStorage(e.target.result, file.name).then(pubUrl => {
              item.url = pubUrl; item.origUrl = pubUrl; syncCaseToDb(c); render();
            });
          }
          const newIdx = c.photos[slot].length - 1;
          render();
          if (idx === 0) openPhotoEditor(caseId, slot, newIdx);
        };
        reader.readAsDataURL(file);
      });
      input.value = '';
    }

      c.reportPlan = document.getElementById('rp-plan').value;
      c.dueDate = document.getElementById('rp-due').value;
      c.completedDate = document.getElementById('rp-done-date').value;
      c.workDone = document.getElementById('rp-done').checked;

      showToast('현장 보고서가 저장되었습니다.');

    function addBlankEstimateRow(caseId) {
      const c = state.cases.find(x => x.id === caseId);
      if (c) { c.estimateItems.push({ id: 'ei' + Date.now(), cat: '재료비', item: '신규 공정 항목', unit: '식', qty: 1, price: 100000 }); render(); }
    }

    function updateEstField(caseId, idx, field, val) {
      const c = state.cases.find(x => x.id === caseId);
      if (c && c.estimateItems[idx]) { c.estimateItems[idx][field] = val; render(); }
    }

    function submitEstimate(caseId, isFinal) {
      const c = state.cases.find(x => x.id === caseId);
      if (!c) return;
      const totals = calcEstimateTotals(c.estimateItems, 0.05, 0.10);
      c.estimateMemo = document.getElementById('est-memo').value;
      c.partnerClaimAmt = totals.total;

      c.partnerStatus = '대흥이엔씨 처리 중';
      c.stage = isFinal ? '03' : '02';
      c.claimStage = 'need_write';
      syncCaseToDb(c);
      showToast(isFinal ? '최종견적(업체 청구)이 제출되었습니다.' : '최초견적이 제출되었습니다.');

    // =========================================================================
    // 10-C. 사진 편집 모달 ('치수·글씨 넣기' - 글씨, 치수, 화살표, 도형, 옮기기)
    // =========================================================================
    const peState = {
      caseId: null, slot: null, index: -1,
      tool: 'text', shape: 'circle', color: '#ef4444', width: 4,
      showMoreColors: false, showCaption: false, caption: '',
      img: null, annotations: [], selectedIdx: -1,
      dragging: false, dragMode: '', startX: 0, startY: 0, curX: 0, curY: 0,
      dragOffsetX: 0, dragOffsetY: 0
    };

    const PE_GUIDES = {
      text: '글씨를 넣을 자리를 누르고 바로 입력하세요.',
      dim: '길이를 잴 구간을 끌어서 그리고 치수(예: 5m)를 적으세요.',
      arrow: '끌어서 화살표를 그립니다. 끝나는 쪽에 화살촉이 붙습니다.',
      shape_line: '사진 위를 끌어서 선을 그립니다.',
      shape_circle: '끌어서 원(타원)으로 피해 부분을 감쌉니다.',
      shape_rect: '끌어서 네모로 감쌉니다.',
      move: '넣은 표시를 끌어서 옮깁니다. 글씨·치수는 누르면 고칩니다.'
    };

    function getPeGuide() {
      if (peState.tool === 'shape') return PE_GUIDES['shape_' + peState.shape];
      return PE_GUIDES[peState.tool] || '';
    }

    function getPeTargetPhoto(caseId, slot, index) {
      if (caseId === '__NEW_CASE__') return state.newCaseForm.files[index];
      const c = ensureCaseDetails(state.cases.find(x => x.id === caseId));
      return c?.photos?.[slot]?.[index];
    }

    function openPhotoEditor(caseId, slot, index) {
      const p = getPeTargetPhoto(caseId, slot, index);
      if (!p) return;
      peState.caseId = caseId;
      peState.slot = slot;
      peState.index = index;
      peState.tool = 'text';
      peState.shape = 'circle';
      peState.color = '#ef4444';
      peState.width = 4;
      peState.showMoreColors = false;
      peState.showCaption = Boolean(p.caption);
      peState.caption = p.caption || '';
      peState.annotations = JSON.parse(JSON.stringify(p.annotations || []));
      peState.selectedIdx = -1;
      peState.dragging = false;

      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        peState.img = img;
        renderPhotoEditorModal();
      };
      img.src = p.origUrl || p.url;
    }

    function renderPhotoEditorModal() {
      const root = document.getElementById('modal-root');
      const baseColors = [
        { hex: '#ef4444', name: '빨강' },
        { hex: '#eab308', name: '노랑' },
        { hex: '#ffffff', name: '하양' },
        { hex: '#0f172a', name: '검정' }
      ];
      const extraColors = [
        { hex: '#2563eb', name: '파랑' },
        { hex: '#16a34a', name: '초록' }
      ];
      const colors = peState.showMoreColors ? [...baseColors, ...extraColors] : baseColors;

      root.innerHTML = `
        <div class="fixed inset-0 z-50 bg-slate-900/75 flex items-center justify-center p-2 sm:p-4">
          <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[95vh] flex flex-col overflow-hidden">
            <!-- 상단 헤더 -->
            <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between">
              <button type="button" onclick="closeModal()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100 cursor-pointer">취소</button>
              <h3 class="text-sm font-bold text-slate-900">치수·글씨 넣기</h3>
              <button type="button" onclick="savePhotoEditor()" class="px-4 py-1.5 rounded-lg bg-blue-700 hover:bg-blue-800 text-white text-xs font-semibold cursor-pointer">저장</button>
            </div>

            <!-- 상단 안내 배너 -->
            <div class="px-4 py-2 bg-blue-50 border-b border-blue-100 text-xs text-blue-800 font-medium text-center">
              ${escapeHtml(getPeGuide())}
            </div>

            <!-- 사진 캔버스 + 우측 하단 플로팅 버튼 + 인라인 텍스트 입력 팝업 -->
            <div class="relative bg-slate-900 flex items-center justify-center overflow-hidden flex-1 min-h-[260px]">
              <canvas id="pe-canvas" class="max-w-full max-h-[52vh] touch-none cursor-crosshair"></canvas>
              <div id="pe-inline-box" class="hidden absolute z-10 bg-white rounded-xl shadow-xl border border-slate-200 p-2.5 flex items-center gap-1.5">
                <input id="pe-inline-input" type="text" placeholder="내용 입력" class="px-2.5 py-1.5 rounded-lg border border-slate-300 text-xs w-36 focus:outline-none focus:ring-2 focus:ring-blue-600" />
                <button type="button" onclick="confirmPeInlineText()" class="px-2.5 py-1.5 rounded-lg bg-blue-700 text-white text-xs font-semibold cursor-pointer">확인</button>
                <button type="button" onclick="cancelPeInlineText()" class="px-2 py-1.5 rounded-lg border border-slate-200 text-xs cursor-pointer">취소</button>
              </div>
              <div class="absolute bottom-3 right-3 flex gap-1.5">
                <button type="button" onclick="peUndo()" class="px-2.5 py-1.5 rounded-lg bg-slate-800/85 hover:bg-slate-800 text-white text-[11px] font-semibold cursor-pointer">되돌리기</button>
                <button type="button" onclick="peDeleteSelected()" class="px-2.5 py-1.5 rounded-lg bg-rose-600/90 hover:bg-rose-600 text-white text-[11px] font-semibold cursor-pointer">선택 지우기</button>
              </div>

                <span>${peState.showCaption ? '▼' : '▶'} 산출식 · 설명 (선택 · 사진 아래에 함께 저장됩니다)</span>
              </button>
              ${peState.showCaption ? `
                <textarea id="pe-caption" rows="2" oninput="peState.caption=this.value" placeholder="예: 벽면 철거 (1+25.2+1.5)×3.5 = 287㎡" class="mt-2 w-full px-3 py-2 rounded-xl border border-slate-200 bg-white text-xs">${escapeHtml(peState.caption)}</textarea>
              ` : ''}
            </div>

            <!-- 색상 & 굵기 선택 바 -->
            <div class="px-4 py-2.5 border-t border-slate-200 flex flex-wrap items-center justify-between gap-2 bg-white">
              <div class="flex items-center gap-2">
                ${colors.map(cl => `
                  <button type="button" onclick="peState.color='${cl.hex}'; renderPhotoEditorModal();" title="${cl.name}"
                    class="w-6 h-6 rounded-full border cursor-pointer ${peState.color===cl.hex ? 'ring-2 ring-blue-600 ring-offset-1 border-slate-400' : 'border-slate-300'}"
                    style="background-color:${cl.hex}"></button>
                `).join('')}
                <button type="button" onclick="peState.showMoreColors=!peState.showMoreColors; renderPhotoEditorModal();" class="text-[11px] font-semibold text-blue-700 hover:underline ml-1 cursor-pointer">
                  ${peState.showMoreColors ? '접기' : '색 더 보기'}
                </button>
              </div>
              <div class="flex items-center gap-1">
                ${[['얇게', 2], ['보통', 4], ['굵게', 7]].map(([lbl, w]) => `
                  <button type="button" onclick="peState.width=${w}; renderPhotoEditorModal();"
                    class="px-2.5 py-1 rounded-lg text-[11px] font-semibold cursor-pointer ${peState.width===w ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}">${lbl}</button>

            ${peState.tool === 'shape' ? `

                ${[['line', '선'], ['circle', '원'], ['rect', '네모']].map(([k, lbl]) => `
                  <button type="button" onclick="peState.shape='${k}'; renderPhotoEditorModal();"

    let pePendingTextAction = null;

    function setupPeCanvas() {
      const canvas = document.getElementById('pe-canvas');
      if (!canvas || !peState.img) return;
      const maxW = 800;
      const scale = peState.img.width > maxW ? maxW / peState.img.width : 1;
      canvas.width = Math.round(peState.img.width * scale);
      canvas.height = Math.round(peState.img.height * scale);
      drawPeCanvas();

      const getPos = e => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      };

      const onDown = e => {
        const pos = getPos(e);
        if (peState.tool === 'text') {
          showPeInlineInput(pos.x, pos.y, '', val => {
            if (val) { peState.annotations.push({ type: 'text', x: pos.x, y: pos.y, text: val, color: peState.color, width: peState.width }); drawPeCanvas(); }
          });
          return;
        }
        if (peState.tool === 'move') {
          const hit = findAnnotationAt(pos.x, pos.y);
          peState.selectedIdx = hit;
          if (hit >= 0) {
            const ann = peState.annotations[hit];
            peState.dragging = true;
            peState.startX = pos.x; peState.startY = pos.y;
            peState.dragOffsetX = pos.x; peState.dragOffsetY = pos.y;
          }
          drawPeCanvas();
          return;
        }
        peState.dragging = true;
        peState.startX = pos.x; peState.startY = pos.y;
        peState.curX = pos.x; peState.curY = pos.y;
      };

      const onMove = e => {
        if (!peState.dragging) return;
        e.preventDefault();
        const pos = getPos(e);
        if (peState.tool === 'move' && peState.selectedIdx >= 0) {
          const dx = pos.x - peState.dragOffsetX;
          const dy = pos.y - peState.dragOffsetY;
          const ann = peState.annotations[peState.selectedIdx];
          if (ann.type === 'text') { ann.x += dx; ann.y += dy; }
          else { ann.x1 += dx; ann.y1 += dy; ann.x2 += dx; ann.y2 += dy; }
          peState.dragOffsetX = pos.x; peState.dragOffsetY = pos.y;
          drawPeCanvas();
          return;
        }
        peState.curX = pos.x; peState.curY = pos.y;
        drawPeCanvas();
        drawAnnotation(canvas.getContext('2d'), buildTempAnnotation(), false);
      };

      const onUp = e => {
        if (!peState.dragging) return;
        peState.dragging = false;
        if (peState.tool === 'move') {
          if (peState.selectedIdx >= 0 && Math.hypot(peState.curX - peState.startX, peState.curY - peState.startY) < 4) {
            const ann = peState.annotations[peState.selectedIdx];
            if (ann.type === 'text' || ann.type === 'dim') {
              const cx = ann.type === 'text' ? ann.x : (ann.x1 + ann.x2) / 2;
              const cy = ann.type === 'text' ? ann.y : (ann.y1 + ann.y2) / 2;
              showPeInlineInput(cx, cy, ann.text || '', val => {
                if (val !== null) { ann.text = val; drawPeCanvas(); }
              });
            }
          }
          return;
        }
        if (Math.hypot(peState.curX - peState.startX, peState.curY - peState.startY) < 8) return;
        const item = buildTempAnnotation();
        if (peState.tool === 'dim') {
          showPeInlineInput((item.x1 + item.x2) / 2, (item.y1 + item.y2) / 2, '5m', val => {
            item.text = val || '치수';
            peState.annotations.push(item);
            drawPeCanvas();
          });
        } else {
          peState.annotations.push(item);
          drawPeCanvas();
        }
      };

      canvas.onmousedown = onDown;
      canvas.onmousemove = onMove;
      window.onmouseup = onUp;
      canvas.ontouchstart = onDown;
      canvas.ontouchmove = onMove;
      canvas.ontouchend = onUp;
    }

    function buildTempAnnotation() {
      const t = peState.tool === 'shape' ? peState.shape : peState.tool;
      return { type: t, x1: peState.startX, y1: peState.startY, x2: peState.curX, y2: peState.curY, text: '', color: peState.color, width: peState.width };
    }

    function findAnnotationAt(x, y) {
      for (let i = peState.annotations.length - 1; i >= 0; i--) {
        const a = peState.annotations[i];
        if (a.type === 'text') {
          if (Math.abs(x - a.x) < 60 && Math.abs(y - a.y) < 24) return i;
        } else {
          const minX = Math.min(a.x1, a.x2) - 16, maxX = Math.max(a.x1, a.x2) + 16;
          const minY = Math.min(a.y1, a.y2) - 16, maxY = Math.max(a.y1, a.y2) + 16;
          if (x >= minX && x <= maxX && y >= minY && y <= maxY) return i;
        }
      }
      return -1;
    }

    function showPeInlineInput(cx, cy, defaultVal, cb) {
      const box = document.getElementById('pe-inline-box');
      const inp = document.getElementById('pe-inline-input');
      if (!box || !inp) return;
      pePendingTextAction = cb;
      inp.value = defaultVal;
      box.classList.remove('hidden');
      box.style.left = '50%';
      box.style.top = '16px';
      box.style.transform = 'translateX(-50%)';
      inp.focus();
      inp.onkeydown = ev => { if (ev.key === 'Enter') confirmPeInlineText(); if (ev.key === 'Escape') cancelPeInlineText(); };
    }

    function confirmPeInlineText() {
      const box = document.getElementById('pe-inline-box');
      const inp = document.getElementById('pe-inline-input');
      if (box) box.classList.add('hidden');
      if (pePendingTextAction) { pePendingTextAction(inp.value.trim()); pePendingTextAction = null; }
    }

    function cancelPeInlineText() {
      const box = document.getElementById('pe-inline-box');
      if (box) box.classList.add('hidden');
      pePendingTextAction = null;
    }

    function drawPeCanvas() {
      const canvas = document.getElementById('pe-canvas');
      if (!canvas || !peState.img) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(peState.img, 0, 0, canvas.width, canvas.height);
      peState.annotations.forEach((ann, idx) => drawAnnotation(ctx, ann, idx === peState.selectedIdx));
    }

    function drawAnnotation(ctx, a, selected) {
      ctx.save();
      ctx.strokeStyle = a.color;
      ctx.fillStyle = a.color;
      ctx.lineWidth = a.width || 4;
      ctx.lineCap = 'round';
      if (selected) { ctx.shadowColor = '#3b82f6'; ctx.shadowBlur = 10; }

      if (a.type === 'text') {
        const fs = (a.width || 4) * 4 + 10;
        ctx.font = `bold ${fs}px Inter, sans-serif`;
        ctx.lineWidth = 3;
        ctx.strokeStyle = a.color === '#ffffff' ? '#0f172a' : '#ffffff';
        ctx.strokeText(a.text, a.x, a.y);
        ctx.fillText(a.text, a.x, a.y);
      } else if (a.type === 'line') {
        ctx.beginPath(); ctx.moveTo(a.x1, a.y1); ctx.lineTo(a.x2, a.y2); ctx.stroke();
      } else if (a.type === 'rect') {
        ctx.strokeRect(a.x1, a.y1, a.x2 - a.x1, a.y2 - a.y1);
      } else if (a.type === 'circle') {
        const cx = (a.x1 + a.x2) / 2, cy = (a.y1 + a.y2) / 2;
        const rx = Math.abs(a.x2 - a.x1) / 2, ry = Math.abs(a.y2 - a.y1) / 2;
        ctx.beginPath(); ctx.ellipse(cx, cy, Math.max(rx, 2), Math.max(ry, 2), 0, 0, Math.PI * 2); ctx.stroke();
      } else if (a.type === 'arrow' || a.type === 'dim') {
        const angle = Math.atan2(a.y2 - a.y1, a.x2 - a.x1);
        const head = 12 + (a.width || 4);
        ctx.beginPath(); ctx.moveTo(a.x1, a.y1); ctx.lineTo(a.x2, a.y2); ctx.stroke();
        // 끝 화살표
        ctx.beginPath();
        ctx.moveTo(a.x2, a.y2);
        ctx.lineTo(a.x2 - head * Math.cos(angle - Math.PI / 6), a.y2 - head * Math.sin(angle - Math.PI / 6));
        ctx.moveTo(a.x2, a.y2);
        ctx.lineTo(a.x2 - head * Math.cos(angle + Math.PI / 6), a.y2 - head * Math.sin(angle + Math.PI / 6));
        ctx.stroke();
        if (a.type === 'dim') {
          // 시작점 화살표 및 치수 텍스트
          ctx.beginPath();
          ctx.moveTo(a.x1, a.y1);
          ctx.lineTo(a.x1 + head * Math.cos(angle - Math.PI / 6), a.y1 + head * Math.sin(angle - Math.PI / 6));
          ctx.moveTo(a.x1, a.y1);
          ctx.lineTo(a.x1 + head * Math.cos(angle + Math.PI / 6), a.y1 + head * Math.sin(angle + Math.PI / 6));
          ctx.stroke();
          if (a.text) {
            const mx = (a.x1 + a.x2) / 2, my = (a.y1 + a.y2) / 2 - 8;
            ctx.font = 'bold 16px Inter, sans-serif';
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ffffff';
            ctx.strokeText(a.text, mx - 14, my);
            ctx.fillText(a.text, mx - 14, my);
          }
        }
      }
      ctx.restore();
    }

    function peUndo() {
      if (peState.annotations.length > 0) { peState.annotations.pop(); peState.selectedIdx = -1; drawPeCanvas(); }
    }

    function peDeleteSelected() {
      if (peState.selectedIdx >= 0) {
        peState.annotations.splice(peState.selectedIdx, 1);
        peState.selectedIdx = -1;
      } else if (peState.annotations.length > 0) {
        peState.annotations.pop();
      }
      drawPeCanvas();
    }

      if (targetId === 'newCaseForm') return state.newCaseForm;

    function destroyActiveMap() {
      if (activeLeafletMap) {
        try { activeLeafletMap.remove(); } catch (e) {}
        activeLeafletMap = null;
        activeLeafletMarker = null;
      }
    }

    function initLocationMap(containerId, targetId) {
      const el = document.getElementById(containerId);
      const obj = getMapTargetObj(targetId);
      if (!el || !obj || !window.L) return;
      destroyActiveMap();
      const lat = Number(obj.lat || 37.5665);
      const lng = Number(obj.lng || 126.9780);
      activeLeafletMap = L.map(el).setView([lat, lng], 15);
      const tileUrl = obj.mapMode === 'satellite'
        ? 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
        : 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}';
      L.tileLayer(tileUrl, { maxZoom: 19, attribution: 'Esri' }).addTo(activeLeafletMap);
      activeLeafletMarker = L.marker([lat, lng]).addTo(activeLeafletMap);

      activeLeafletMap.on('click', e => {
        obj.lat = e.latlng.lat;
        obj.lng = e.latlng.lng;
        if (activeLeafletMarker) activeLeafletMarker.setLatLng(e.latlng);
        if (!obj.address || obj.address === '위치 추후 보완') {
          obj.address = `지도 핀 지정 (${obj.lat.toFixed(4)}, ${obj.lng.toFixed(4)})`;
        }
        render();
      });
    }

    function setMapLayer(targetId, mode) {
      const obj = getMapTargetObj(targetId);
      if (obj) { obj.mapMode = mode; render(); }
    }

    async function searchAddressOnMap(targetId, query) {
      const obj = getMapTargetObj(targetId);
      const q = (query || '').trim();
      if (!obj || !q) { showToast('검색할 주소나 지역명을 입력해 주세요.', 'error'); return; }
      obj.address = q;
      // 1) ArcGIS World Geocoder 시도
      try {
        const res = await fetch('https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=json&maxLocations=1&SingleLine=' + encodeURIComponent(q));
        if (res.ok) {
          const data = await res.json();
          if (data.candidates && data.candidates.length > 0) {
            obj.lat = data.candidates[0].location.y;
            obj.lng = data.candidates[0].location.x;
            showToast('지도에서 위치를 찾았습니다.');
            render();
            return;
          }
        }
      } catch (e) {}
      // 2) 국내 주요 지역 키워드 폴백
      const hit = KR_PRESET_COORDS.find(p => q.includes(p.kw));
      if (hit) {
        obj.lat = hit.lat;
        obj.lng = hit.lng;
        showToast(`'${hit.kw}' 인근 좌표로 지도를 이동했습니다.`);
      } else {
        showToast('입력한 주소를 저장했습니다. 세부 위치는 지도를 클릭해 핀을 옮겨 주세요.', 'info');
      }
      render();
    }

    function locateMeOnMap(targetId) {
      const obj = getMapTargetObj(targetId);
      if (!obj) return;
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            obj.lat = pos.coords.latitude;
            obj.lng = pos.coords.longitude;
            obj.address = `현재 위치 (${obj.lat.toFixed(4)}, ${obj.lng.toFixed(4)})`;
            showToast('현재 위치가 지도에 반영되었습니다.');
            render();
          },
          () => {
            obj.lat = 37.5665;
            obj.lng = 126.9780;
            obj.address = '서울 중구 세종대로 110 (기본 위치)';
            showToast('브라우저 위치 권한이 없어 서울 시청 기준으로 표시합니다.', 'info');
            render();
          },
          { timeout: 4000 }
        );
      } else {
        obj.lat = 37.5665; obj.lng = 126.9780;
        render();
      }
    }

              <h3 class="text-base font-bold text-slate-900">피해현장 기본정보</h3>
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 text-xs">
                <div><span class="text-slate-400">보험사·접수번호</span><div class="font-semibold mt-0.5">${escapeHtml(c.insurerOrg)} · ${escapeHtml(c.insurerCaseNo || c.id)}</div></div>
                <div><span class="text-slate-400">손해·보험 구분</span><div class="font-semibold mt-0.5">${escapeHtml(c.kind)} · ${escapeHtml(c.insType || '자동차 대물')}</div></div>
                <div><span class="text-slate-400">피해 위치</span><div class="font-semibold mt-0.5">${escapeHtml(c.address)}</div></div>
                <div><span class="text-slate-400">사고일 / 접수일</span><div class="font-semibold mt-0.5">${escapeHtml(c.date)}</div></div>
                <div><span class="text-slate-400">시설물 분류</span><div class="font-semibold mt-0.5">${escapeHtml((c.selectedFacilities || [c.facility]).join(', '))}</div></div>
                <div><span class="text-slate-400">피해자</span><div class="font-semibold mt-0.5">${escapeHtml(c.victimName || '미등록')} ${c.victimPhone ? '· ' + escapeHtml(c.victimPhone) : ''}</div></div>
                <div><span class="text-slate-400">사고 차량번호</span><div class="font-semibold mt-0.5">${escapeHtml(c.plate || '미등록')}</div></div>
                <div><span class="text-slate-400">피해시설 관리기관</span><div class="font-semibold mt-0.5">${escapeHtml(c.adminOrg || '미등록')}</div></div>
              </div>

              <!-- 피해 위치 지도 -->
              <div class="space-y-2 pt-2 border-t border-slate-100">
                <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
                  <span class="font-bold text-slate-700">피해 위치 지도</span>
                  <div class="flex gap-1.5">
                    <a href="https://map.kakao.com/link/search/${encodeURIComponent(c.address)}" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1 rounded-lg bg-amber-50 text-amber-800 border border-amber-200 font-semibold hover:bg-amber-100">카카오맵 길찾기</a>
                    <a href="https://map.naver.com/v5/search/${encodeURIComponent(c.address)}" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-200 font-semibold hover:bg-emerald-100">네이버 지도</a>
                  </div>
                </div>
                <div class="relative rounded-2xl border border-slate-200 overflow-hidden">
                  <div id="cd-leaflet-map" style="height: 240px; width: 100%; z-index: 1;"></div>
                  <div class="absolute top-2.5 right-2.5 z-[400] bg-white rounded-lg border border-slate-200 p-1 flex gap-1 text-[11px] font-semibold shadow-xs">
                    <button type="button" onclick="setMapLayer('${c.id}','normal')" class="px-2 py-1 rounded cursor-pointer ${c.mapMode==='normal'?'bg-blue-700 text-white':'text-slate-600'}">일반 지도</button>
                    <button type="button" onclick="setMapLayer('${c.id}','satellite')" class="px-2 py-1 rounded cursor-pointer ${c.mapMode==='satellite'?'bg-blue-700 text-white':'text-slate-600'}">위성 사진</button>
                  </div>
                </div>
              </div>

              <!-- 의뢰 내용 및 첨부 -->
              <div class="space-y-2 pt-2 border-t border-slate-100 text-xs">
                <div class="font-bold text-slate-700">의뢰 내용</div>
                <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 text-slate-700">${escapeHtml(c.accidentDesc || '작성된 의뢰 내용이 없습니다.')}</div>
              </div>
            </div>

            <!-- 2. 피해현장 사진·동영상 -->
            <div id="cd-sec-media" class="bg-white rounded-2xl border border-slate-200 p-5 space-y-3">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h3 class="text-base font-bold text-slate-900">피해현장 사진·동영상</h3>
                  <p class="text-xs text-slate-500">피해현장 관계자가 추가한 사진과 첨부 자료입니다.</p>
                </div>
                <label class="px-3 py-1.5 rounded-xl bg-blue-700 text-white text-xs font-semibold hover:bg-blue-800 cursor-pointer">
                  + 사진 넣기
                  <input type="file" multiple accept="image/*" class="hidden" onchange="handleCaseDetailExtraPhoto('${c.id}', this)" />
                </label>
              </div>
              ${extraDocs.length > 0 ? `
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                  ${extraDocs.map((p, idx) => `
                    <div class="rounded-xl border border-slate-200 overflow-hidden bg-slate-50 flex flex-col">
                      <img src="${p.url}" class="w-full h-28 object-cover cursor-pointer" onclick="openPhotoEditor('${c.id}','docs',${idx})" />
                      <div class="p-2 text-[11px] truncate font-medium text-slate-700">${escapeHtml(p.name || '첨부 사진')}</div>
                      <button type="button" onclick="openPhotoEditor('${c.id}','docs',${idx})" class="py-1.5 text-[11px] font-semibold text-blue-700 bg-white border-t border-slate-200 hover:bg-blue-50 cursor-pointer">치수·글씨</button>
                    </div>
                  `).join('')}
                </div>
              ` : '<div class="p-6 rounded-xl border border-dashed border-slate-200 text-center text-xs text-slate-400">등록된 파일이 없습니다.</div>'}
            </div>

            <!-- 3. 현장 보고 (현장 자료) -->
            <div id="cd-sec-report" class="bg-white rounded-2xl border border-slate-200 p-5 space-y-3">
              <div class="flex items-center justify-between">
                <h3 class="text-base font-bold text-slate-900">현장 보고</h3>
                <span class="px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-800 text-[11px] font-bold">${c.workDone ? '현장 작업 완료' : '현장 자료 작성 중'}</span>
              </div>
              <div class="grid grid-cols-2 gap-3 text-xs">
                <div><span class="text-slate-400">복구 예정일</span><div class="font-semibold mt-0.5">${escapeHtml(c.dueDate || '미등록')}</div></div>
                <div><span class="text-slate-400">현장 완료일</span><div class="font-semibold mt-0.5">${escapeHtml(c.completedDate || '미등록')}</div></div>
              </div>
              <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-700">${escapeHtml(c.reportDesc || '보고 내용이 없습니다.')}</div>
              ${reportPhotos.length > 0 ? `
                <div class="grid grid-cols-3 gap-2">
                  ${reportPhotos.map(p => `<img src="${p.url}" class="w-full h-24 object-cover rounded-xl border border-slate-200" />`).join('')}
                </div>
              ` : ''}
            </div>

            <!-- 4. 최초견적 (대흥이엔씨 검토) -->
            <div id="cd-sec-est" class="bg-white rounded-2xl border border-slate-200 p-5 space-y-2">
              <h3 class="text-base font-bold text-slate-900">최초견적 (대흥이엔씨 검토)</h3>
              ${c.insurerClaimAmt > 0
                ? `<div class="p-4 rounded-xl bg-blue-50 border border-blue-200 flex items-center justify-between text-sm"><span class="font-semibold text-blue-900">검토 공개 금액</span><strong class="text-blue-700 text-base">${won(c.insurerClaimAmt)}</strong></div>`
                : '<p class="text-xs text-slate-500">대흥이엔씨가 업체 견적을 검토한 뒤 공개됩니다.</p>'}
            </div>
          </div>

          <!-- 우측 사이드 칼럼 -->
          <div id="cd-sec-side" class="space-y-5">
            <div class="bg-white rounded-2xl border border-slate-200 p-5 space-y-3 text-xs">
              <h3 class="text-sm font-bold text-slate-900">관계자</h3>
              <div class="space-y-2.5">
                <div class="p-2.5 rounded-xl bg-slate-50"><div class="text-slate-400">의뢰 기관</div><div class="font-bold text-slate-900 mt-0.5">${escapeHtml(c.insurerOrg)} · ${escapeHtml(c.insurerPhone || '010-4821-3309')}</div></div>
                <div class="p-2.5 rounded-xl bg-slate-50"><div class="text-slate-400">복구업체 / 담당자</div><div class="font-bold text-slate-900 mt-0.5">${escapeHtml(c.partnerOrg)} · ${escapeHtml(c.partnerManager)}</div></div>
                <div class="p-2.5 rounded-xl bg-slate-50"><div class="text-slate-400">대흥이엔씨 담당</div><div class="font-bold text-slate-900 mt-0.5">이서연 · 010-9102-7740</div></div>
              </div>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 p-5 space-y-3 text-xs">
              <h3 class="text-sm font-bold text-slate-900">업무 메모</h3>
              <div class="flex gap-2">
                <input id="cd-memo-input" type="text" placeholder="메모를 입력하세요" class="flex-1 px-3 py-2 rounded-xl border border-slate-200 text-xs" />
                <button type="button" onclick="addCaseMemo('${c.id}')" class="px-3 py-2 rounded-xl bg-blue-700 text-white font-semibold cursor-pointer shrink-0">메모 추가</button>
              </div>
              <div class="space-y-2 max-h-48 overflow-y-auto">
                ${c.memos.length > 0 ? c.memos.map(m => `
                  <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-100">
                    <div class="font-semibold text-slate-900">${escapeHtml(m.text)}</div>
                    <div class="text-[10px] text-slate-400 mt-0.5">${escapeHtml(m.author)} · ${escapeHtml(m.date)}</div>
                  </div>
                `).join('') : '<div class="text-slate-400 py-2">등록된 업무 메모가 없습니다.</div>'}
              </div>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 p-5 space-y-3 text-xs">
              <h3 class="text-sm font-bold text-slate-900">처리 기록</h3>
              <div class="space-y-2 border-l-2 border-blue-200 pl-3">
                ${c.history.map(h => `
                  <div>
                    <div class="font-semibold text-slate-800">${escapeHtml(h.text)}</div>
                    <div class="text-[10px] text-slate-400">${escapeHtml(h.date)}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function destroyCharts() {
      chartInstances.forEach(ch => ch.destroy());
      chartInstances = [];
    }

    function initHomeCharts() {
      destroyCharts();
      const wCtx = document.getElementById('weeklyChart');
      const fCtx = document.getElementById('facilityChart');
      const monthBuckets = {};
      state.cases.forEach(c => {
        const m = (c.date || '2026-11').slice(0, 7);
        if (!monthBuckets[m]) monthBuckets[m] = { total: 0, done: 0 };
        monthBuckets[m].total += 1;
        if (c.stage === 'done') monthBuckets[m].done += 1;
      });
      const mLabels = Object.keys(monthBuckets).sort();
      if (wCtx && window.Chart) {
        chartInstances.push(new Chart(wCtx, {
          type: 'bar',
          data: {
            labels: mLabels.length ? mLabels : ['2026-11'],
            datasets: [
              { label: '접수 건수', data: mLabels.map(k => monthBuckets[k].total), backgroundColor: '#1d4ed8', borderRadius: 6 },
              { label: '종료 완료', data: mLabels.map(k => monthBuckets[k].done), backgroundColor: '#10b981', borderRadius: 6 }
            ]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
        }));
      }
      const facCounts = {};
      state.cases.forEach(c => { facCounts[c.facility] = (facCounts[c.facility] || 0) + 1; });
      const topFac = Object.entries(facCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);
      if (fCtx && window.Chart) {
        chartInstances.push(new Chart(fCtx, {
          type: 'bar',
          data: {
            labels: topFac.map(x => x[0]),
            datasets: [{ label: '접수 건수', data: topFac.map(x => x[1]), backgroundColor: '#3b82f6', borderRadius: 6 }]
          },
          options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } } } }
        }));
      }
    }

    function render() {
      destroyCharts();
      destroyActiveMap();
      const root = document.getElementById('app');
      if (!state.user) {
        root.innerHTML = renderLogin();
        const form = document.getElementById('login-form');
        if (form) {
          form.addEventListener('submit', e => {
            e.preventDefault();
            loginWithCredentials(document.getElementById('login-id').value, document.getElementById('login-pw').value);
          });
        }
        return;
      }

      let pageHtml = '';
      if (state.route === 'home' && state.user.role === 'daehung') pageHtml = renderDaehungHome();
      else if (state.route === 'cases') {
        pageHtml = state.user.role === 'insurer' ? renderInsurerCases() : state.user.role === 'partner' ? renderPartnerCases() : renderDaehungCases();
      }
      else if (state.route === 'claims') {
        pageHtml = state.user.role === 'insurer' ? renderInsurerClaims() : renderDaehungClaims();
      }
      else if (state.route === 'receipts') pageHtml = renderDaehungReceipts();
      else if (state.route === 'settlements') pageHtml = renderDaehungSettlements();
      else if (state.route === 'reconcile') pageHtml = renderDaehungReconcile();
      else if (state.route === 'rates') pageHtml = renderDaehungRates();
      else if (state.route === 'prices') pageHtml = renderDaehungPrices();
      else if (state.route === 'accounts') pageHtml = renderPartnerAccounts();
      else if (['acc_admin', 'acc_partner', 'acc_org'].includes(state.route)) pageHtml = renderDaehungAccounts(state.route);
      else if (state.route === 'settings') pageHtml = renderSettings();
      else if (state.route === 'notices') pageHtml = renderNotices();
      else if (state.route === 'new_case') pageHtml = renderNewCasePage();
      else if (state.route === 'new_case_wizard') pageHtml = renderNewCaseWizardPage();
      else if (state.route === 'claim_detail') pageHtml = renderClaimDetailPage();
      else if (state.route === 'report_edit') pageHtml = renderReportEditPage();
      else if (state.route === 'estimate_edit') pageHtml = renderEstimateEditPage();
      else if (state.route === 'case_detail') pageHtml = renderCaseDetailPage();

      root.innerHTML = renderShell(pageHtml);
      if (window.lucide) lucide.createIcons();
      if (state.route === 'home' && state.user.role === 'daehung') initHomeCharts();
      if (state.route === 'new_case' && state.newCaseForm.openSec2) initLocationMap('nc-leaflet-map', 'newCaseForm');
      if (state.route === 'new_case_wizard' && state.wizardStep === 2) initLocationMap('wz-leaflet-map', state.activeCaseId);
      if (state.route === 'case_detail') initLocationMap('cd-leaflet-map', state.activeCaseId);
    }

    restoreSession();
    render();
    initSupabaseAndLoad(false);
  </script>
</body>
</html>
